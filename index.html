<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Panel Vadori</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<meta name="theme-color" content="#0f766e" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" />
<link rel="stylesheet" href="css/styles.css?v=20260922b" />
</head>
<body>

<header class="topbar">
  <h1>Panel Vadori</h1>
  <span id="fecha-hoy" class="topbar-fecha"></span>
</header>

<main id="app">
  <nav class="rango-tabs area-tabs" data-area="suites" hidden>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="checkins">Check-ins</button>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="calendario">Calendario</button>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="estado">Estado</button>
  </nav>

  <nav class="rango-tabs area-tabs" data-area="administracion" hidden>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="caja">Caja</button>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="horas">Horas</button>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="resumen">Resumen</button>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="cuenta-corriente">Cta. corriente</button>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="mpago">M.Pago</button>
    <button type="button" class="rango-tab area-tab-btn" data-seccion="proveedores">Proveedores</button>
  </nav>

  <section id="view-hoy" class="view" hidden>
    <div id="hoy-estado" class="estado-msg"></div>
    <div id="hoy-content"></div>
  </section>

  <section id="view-checkins" class="view" hidden>
    <div id="checkins-estado" class="estado-msg"></div>
    <div id="checkins-content"></div>
  </section>

  <section id="view-calendario" class="view" hidden>
    <div class="view-toolbar">
      <div id="calendario-estado" class="estado-msg"></div>
    </div>
    <div id="calendar"></div>
  </section>

  <section id="view-limpieza" class="view" hidden>
    <div id="limpieza-estado" class="estado-msg"></div>
    <div id="limpieza-grid" class="unidades-grid"></div>
  </section>

  <section id="view-caja" class="view" hidden>
    <div id="caja-estado" class="estado-msg"></div>
    <div id="caja-content"></div>
  </section>

  <section id="view-horas" class="view" hidden>
    <div id="horas-estado" class="estado-msg"></div>
    <div id="horas-content"></div>
  </section>

  <section id="view-resumen" class="view" hidden>
    <div id="resumen-estado" class="estado-msg"></div>
    <div id="resumen-content"></div>
  </section>

  <section id="view-cuenta-corriente" class="view" hidden>
    <div id="cuenta-corriente-estado" class="estado-msg"></div>
    <div id="cuenta-corriente-content"></div>
  </section>

  <section id="view-mpago" class="view" hidden>
    <div id="mpago-estado" class="estado-msg"></div>
    <div id="mpago-content"></div>
  </section>

  <section id="view-proveedores" class="view" hidden>
    <div class="empty-msg">Próximamente.</div>
  </section>

  <section id="view-mas" class="view" hidden>
    <div class="empty-msg">Próximamente.</div>
  </section>
</main>

<nav class="tabbar">
  <button type="button" class="tab-btn" data-area="hoy">
    <span class="tab-icon">☀</span>
    <span>Hoy</span>
  </button>
  <button type="button" class="tab-btn" data-area="suites">
    <span class="tab-icon">✓</span>
    <span>Suites</span>
  </button>
  <button type="button" class="tab-btn" data-area="administracion">
    <span class="tab-icon">$</span>
    <span>Administración</span>
  </button>
  <button type="button" class="tab-btn" data-area="mas">
    <span class="tab-icon">⋯</span>
    <span>Más</span>
  </button>
</nav>

<script src="js/config.js?v=20260922b"></script>
<script src="js/api.js?v=20260922b"></script>
<script src="js/utils.js?v=20260922b"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="js/views/hoy.js?v=20260922b"></script>
<script src="js/views/limpieza.js?v=20260922b"></script>
<script src="js/views/calendario.js?v=20260922b"></script>
<script src="js/views/horas.js?v=20260922b"></script>
<script src="js/views/checkins.js?v=20260922b"></script>
<script src="js/views/caja.js?v=20260922b"></script>
<script src="js/views/resumen_semanal.js?v=20260922b"></script>
<script src="js/views/cuenta_corriente.js?v=20260922b"></script>
<script src="js/views/mpago.js?v=20260922b"></script>
<script src="js/main.js?v=20260922b"></script>
</body>
</html>
